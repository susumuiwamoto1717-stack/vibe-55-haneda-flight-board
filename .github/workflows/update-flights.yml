name: Update flight data (hourly)

on:
  schedule:
    # 毎時5分に実行（UTC）。羽田公式への負荷を1時間1回に抑える
    - cron: "5 * * * *"
  workflow_dispatch: {}   # 手動実行も可能

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest flight data (JST date)
        run: |
          export TZ=Asia/Tokyo
          python3 fetch_haneda.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flights_data.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: hourly flight data update"
            git push
          fi
